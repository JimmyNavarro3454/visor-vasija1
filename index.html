<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    model-viewer {
      width: 100%;
      height: 80vh;
      background: #f2f2f2;
    }

    h2 {
      margin: 15px;
    }
  </style>
</head>

<body>

<h2>Visualizador 3D</h2>

<model-viewer
    src="modelo.glb"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1">

    <button slot="ar-button"
      style="
      background:white;
      border:1px solid #ccc;
      padding:14px 22px;
      border-radius:8px;
      position:absolute;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      font-size:16px;">
      Ver en realidad aumentada
    </button>

</model-viewer>

</body>
</html>
